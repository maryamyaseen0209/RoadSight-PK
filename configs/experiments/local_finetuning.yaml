# Experiment 4: Local Pakistani Road Adaptation & Data Efficiency Curve
# Fine-tuning baseline with varying percentages of Pakistani road data (10%, 25%, 50%, 100%)

experiment_name: exp4_pakistani_adaptation
description: Transfer learning with sample efficiency analysis on Pakistani road conditions
random_seeds:
  - 42
  - 123
  - 999

subsets:
  - fraction: 0.10
    label: "10% Data"
  - fraction: 0.25
    label: "25% Data"
  - fraction: 0.50
    label: "50% Data"
  - fraction: 1.00
    label: "100% Data"

training:
  base_checkpoint: artifacts/checkpoints/best_baseline.pt
  epochs: 30
  batch_size: 16
  lr0: 0.0001
  freeze_backbone_epochs: 5

grouping_strategy:
  group_by: collection_session
  stratify_by: defect_presence

output_dir: experiments/metrics/local_finetuning
visualization_dir: experiments/visualizations
